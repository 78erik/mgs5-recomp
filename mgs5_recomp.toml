# MGS5: The Phantom Pain (Xbox 360) - XenonRecomp config
# Target: ARM64 (Android primary, Switch secondary)

[main]
file_path = "game/Metal Gear Solid V The Phantom Pain/Metal Gear Solid V The Phantom Pain/Default.xex"
out_directory_path = "generated/mgs5"
switch_table_file_path = "docs/mgs5_switch_tables.toml"

# Optimizations (enable after successful boot)
skip_lr = false
skip_msr = false
ctr_as_local = false
xer_as_local = false
reserved_as_local = false
cr_as_local = false
non_argument_as_local = false
non_volatile_as_local = false

